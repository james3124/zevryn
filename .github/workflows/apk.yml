name: Build Android APK

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  NDK_VERSION: '26.3.11579264'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub-hosted ubuntu runners ship the Android SDK preinstalled at
      # $ANDROID_HOME with cmdline-tools/latest. Avoid setup-android@v3: it
      # tries to install the removed "tools" package and fails on current
      # runners. Use the preinstalled sdkmanager directly instead.
      - name: Accept SDK licenses + install platform/build-tools/NDK
        run: |
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "Using sdkmanager: $SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" "platforms;android-35" "build-tools;35.0.0" "ndk;$NDK_VERSION"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Set up Rust + Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Run Rust tests (host)
        run: cargo test --all-targets

      - name: Build libzevryn.so for arm64-v8a
        run: cargo ndk -t arm64-v8a -o android/app/src/main/jniLibs build --release

      - name: Verify native library was produced
        run: |
          test -f android/app/src/main/jniLibs/arm64-v8a/libzevryn.so
          ls -l android/app/src/main/jniLibs/arm64-v8a/

      - name: Assemble debug APK with Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.7'
          arguments: '-p android assembleDebug'

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: zevryn-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
