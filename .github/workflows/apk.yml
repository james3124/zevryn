name: Build Android APK

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK + platform
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;26.3.11579264"

      - name: Set up Rust + Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Run Rust tests (host)
        working-directory: .
        run: cargo test --all-targets

      - name: Build libzevryn.so for arm64-v8a
        working-directory: .
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_HOME:-$ANDROID_HOME/ndk/26.3.11579264}"
          cargo ndk -t arm64-v8a -o android/app/src/main/jniLibs build --release

      - name: Verify native library was produced
        run: |
          test -f android/app/src/main/jniLibs/arm64-v8a/libzevryn.so
          ls -l android/app/src/main/jniLibs/arm64-v8a/

      - name: Make Gradle wrapper executable (if present)
        run: |
          if [ -f android/gradlew ]; then chmod +x android/gradlew; fi

      - name: Assemble debug APK with Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.7'
          arguments: '-p android assembleDebug'

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: zevryn-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
