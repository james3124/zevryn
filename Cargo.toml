[package]
name = "zevryn"
version = "0.1.0"
edition = "2021"
description = "Full Rust reimplementation of the GameHub Lite reference, mirrored at reference paths"

[dependencies]

[lib]
# rlib for tests / normal Rust use; cdylib so it can be loaded as libzevryn.so on Android.
crate-type = ["rlib", "cdylib"]

[profile.dev]
opt-level = 0
debug = false
incremental = false
[profile.test]
opt-level = 0
debug = false
incremental = false
